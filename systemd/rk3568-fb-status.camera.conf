[Unit]
After=rk3568-camera-ocr-overlay.service
Wants=rk3568-camera-ocr-overlay.service

[Service]
ExecStart=
ExecStart=/opt/rk3568_camera/.venv-camera/bin/python /opt/rk3568_camera/scripts/fb_status.py --output ili9488 --spidev /dev/spidev1.0 --dc-gpio 116 --reset-gpio 109 --cs-gpio -1 --bl-gpio -1 --width 480 --height 320 --rotate 90 --spi-speed 16000000 --color-order rgb --pixel-format 18 --invert off --url http://127.0.0.1:8894/display/state --interval 0.1 --boot-check-timeout 0
